<div id="root"></div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, doc, getDocs, setDoc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ─── FIREBASE INIT ────────────────────────────────────────────────────────────
let db = null;
let firebaseOk = false;

function initFirebase() {
  try {
    if (FIREBASE_CONFIG.apiKey === "TU_API_KEY") return false;
    const app = initializeApp(FIREBASE_CONFIG);
    db = getFirestore(app);
    return true;
  } catch(e) { console.error(e); return false; }
}

// ─── STATE ────────────────────────────────────────────────────────────────────
let state = {
  teams: [], matches: [], courts: [], bookings: [], votes: [], results: [], rules: [],
  tab: "tabla", isAdmin: false, loading: true,
  modal: null,   // { type, data }
  toast: null,
};

function setState(partial) {
  state = { ...state, ...partial };
  render();
}

// ─── FIRESTORE HELPERS ────────────────────────────────────────────────────────
async function fsGet(col) {
  const snap = await getDocs(collection(db, col));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function fsSet(col, id, data) {
  await setDoc(doc(db, col, id), { ...data, _ts: serverTimestamp() }, { merge: true });
}
async function fsDel(col, id) {
  await deleteDoc(doc(db, col, id));
}

// Subscribe to a collection and update state
function subscribe(col, key) {
  onSnapshot(collection(db, col), snap => {
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    setState({ [key]: docs });
  });
}

// ─── LOAD DATA ────────────────────────────────────────────────────────────────
async function loadAll() {
  if (!firebaseOk) { setState({ loading: false }); return; }
  subscribe("teams",    "teams");
  subscribe("matches",  "matches");
  subscribe("courts",   "courts");
  subscribe("bookings", "bookings");
  subscribe("votes",    "votes");
  subscribe("results",  "results");
  subscribe("rules",    "rules");
  setState({ loading: false });
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function teamName(id) {
  const t = state.teams.find(x => x.id === id);
  return t ? t.name : id;
}

function calcStandings() {
  const stats = {};
  state.teams.forEach(t => {
    stats[t.id] = { id: t.id, name: t.name, pj:0, pg:0, pp:0, pts:0, sf:0, sc:0 };
  });
  state.results.forEach(r => {
    const m = state.matches.find(x => x.id === r.matchId);
    if (!m) return;
    const h = stats[m.homeId], a = stats[m.awayId];
    if (!h || !a) return;

h.pj++;
a.pj++;

h.sf += r.homeSets;
h.sc += r.awaySets;

a.sf += r.awaySets;
a.sc += r.homeSets;

if (r.homeSets > r.awaySets) {

  h.pg++;
  a.pp++;

  h.pts += 3;

} else {

  a.pg++;
  h.pp++;

  a.pts += 3;

}
  });
  return Object.values(stats).sort((a,b) => {

  if (b.pts !== a.pts)
    return b.pts - a.pts;

  const diffA = a.sf - a.sc;
  const diffB = b.sf - b.sc;

  if (diffB !== diffA)
    return diffB - diffA;

  if (b.sf !== a.sf)
    return b.sf - a.sf;

  return a.name.localeCompare(b.name);

});
}

function generateFixture(teams) {
  const list = [...teams];
  if (list.length % 2 !== 0) list.push({ id: "bye" });
  const n = list.length, rounds = n - 1;
  const matches = [];
  let id = 1;
  for (let r = 0; r < rounds; r++) {
    for (let i = 0; i < n / 2; i++) {
      const h = list[i], a = list[n - 1 - i];
      if (h.id !== "bye" && a.id !== "bye") {
        matches.push({ id: String(id++), round: r+1, homeId: h.id, awayId: a.id, status: "pendiente" });
      }
    }
    list.splice(1, 0, list.pop());
  }
  return matches;
}

// ─── TOAST ───────────────────────────────────────────────────────────────────
function toast(msg, type = "ok") {
  setState({ toast: { msg, type } });
  setTimeout(() => setState({ toast: null }), 3000);
}

// ─── ADMIN ACTIONS ───────────────────────────────────────────────────────────
async function addTeam(name, p1, p2) {
  const id = Date.now().toString();
  const team = { id, name, players: [
    { id: `${id}-1`, name: p1 },
    { id: `${id}-2`, name: p2 },
  ]};
  await fsSet("teams", id, team);
  toast(`Equipo "${name}" agregado ✅`);
}

async function updateTeam(id, name, players) {
  await fsSet("teams", id, { name, players });
  toast("Equipo actualizado ✅");
}

async function removeTeam(id) {
  await fsDel("teams", id);
  toast("Equipo eliminado");
}

async function generateFixtureAction() {
  if (state.teams.length < 2) { toast("Necesitás al menos 2 equipos", "err"); return; }
  const fix = generateFixture(state.teams);
  for (const m of fix) await fsSet("matches", m.id, m);
  toast(`Fixture generado: ${fix.length} partidos ✅`);
}

async function resetFixture() {
  for (const m of state.matches)  await fsDel("matches",  m.id);
  for (const r of state.results)  await fsDel("results",  r.id);
  for (const v of state.votes)    await fsDel("votes",    v.id);
  for (const b of state.bookings) await fsDel("bookings", b.id);
  toast("Fixture reiniciado");
}

async function saveResult(matchId, homeSets, awaySets) {
  const id = `res-${matchId}`;
  await fsSet("results", id, { id, matchId, homeSets: Number(homeSets), awaySets: Number(awaySets) });
  await fsSet("matches", matchId, { status: "jugado" });
  toast("Resultado guardado ✅");
}
async function deleteResult(matchId) {
  await fsDel("results", `res-${matchId}`);
  await fsSet("matches", matchId, { status: "pendiente" });
  toast("Resultado eliminado");
}
async function updateCourt(id, name, slotsRaw) {
  const slots = slotsRaw.split(",").map(s => s.trim()).filter(Boolean);
  await fsSet("courts", id, { name, slots });
  toast("Cancha actualizada ✅");
}
async function saveRule(id, title, content) {
  await fsSet("rules", id, { id, title, content });
  toast("Regla guardada ✅");
}

async function addCourt(name, slotsRaw) {
  const id = Date.now().toString();
  const slots = slotsRaw.split(",").map(s => s.trim()).filter(Boolean);
  await fsSet("courts", id, { id, name, slots });
  toast("Cancha agregada ✅");
}

async function removeCourt(id) {
  await fsDel("courts", id);
  toast("Cancha eliminada");
}

async function bookSlot(courtId, slot, teamId) {
  const existing = state.bookings.find(b => b.courtId === courtId && b.timeSlot === slot);
  if (existing) { toast("Horario ya reservado", "err"); return; }
  const id = Date.now().toString();
  await fsSet("bookings", id, { id, courtId, timeSlot: slot, teamId });
  toast("Reserva confirmada ✅");
}

async function cancelBooking(id) {
  await fsDel("bookings", id);
  toast("Reserva cancelada");
}

async function submitVotes(matchId, voterTeamId, flaggedIds, levelOk) {
  if (levelOk || flaggedIds.length === 0) { toast("Voto registrado ✅"); return; }
  for (const pid of flaggedIds) {
    const id = `${matchId}-${voterTeamId}-${pid}`;
    await fsSet("votes", id, { id, matchId, voterTeamId, flaggedId: pid });
  }
  toast("Voto registrado ✅");
}

// ─── MODALS ───────────────────────────────────────────────────────────────────
function openModal(type, data = {}) { setState({ modal: { type, data } }); }
function closeModal() { setState({ modal: null }); }

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById("root");
  if (!root) return;

  // Not configured yet
  if (!firebaseOk) {
    root.innerHTML = renderSetup();
    return;
  }

  if (state.loading) {
    root.innerHTML = `<div class="empty" style="padding:80px">
      <div class="spinner" style="border-color:#1d4ed8;border-top-color:transparent;width:32px;height:32px;margin:0 auto 12px"></div>
      Cargando torneo...
    </div>`;
    return;
  }

  root.innerHTML = `
    ${renderHeader()}
    ${renderNav()}
    <div class="main">${renderTab()}</div>
    ${renderModal()}
    ${state.toast ? `<div class="toast ${state.toast.type === 'err' ? 'error' : ''}">${state.toast.msg}</div>` : ""}
  `;
  attachEvents();
}

// ─── SETUP SCREEN ─────────────────────────────────────────────────────────────
function renderSetup() {
  return `
  <div class="setup-screen">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:48px">🎾</div>
      <div style="font-family:var(--font-display);font-size:36px;letter-spacing:2px;color:var(--navy)">LIGA BARRIO</div>
    </div>
    <div class="setup-card">
      <div class="setup-title">Configuración inicial</div>
      <div class="setup-sub">Para que la app funcione de forma independiente y compartida, necesitás conectarla a Firebase (gratis). Seguí estos pasos:</div>

      <div class="step">
        <div class="step-num">1</div>
        <div class="step-body">
          <h4>Creá un proyecto Firebase</h4>
          <p>Entrá a <a href="https://console.firebase.google.com" target="_blank">console.firebase.google.com</a>, hacé click en <b>"Agregar proyecto"</b>, poné un nombre (ej: <i>liga-barrio</i>) y seguí los pasos.</p>
        </div>
      </div>

      <div class="step">
        <div class="step-num">2</div>
        <div class="step-body">

// ─── NAV ─────────────────────────────────────────────────────────────────────
function renderNav() {

// ─── TAB ROUTER ──────────────────────────────────────────────────────────────
function renderTab() {
  switch(state.tab) {
    case "tabla":      return renderTabla();
    case "fixture":    return renderFixture();
    case "canchas":    return renderCanchas();

// ─── TABLA ───────────────────────────────────────────────────────────────────
function renderTabla() {
  const standings = calcStandings();
  const medals = ["🥇","🥈","🥉"];
  return `
  <div class="section-title">🏆 Tabla de Posiciones</div>
  ${standings.length === 0 ? `<div class="empty">No hay equipos todavía.</div>` : `
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>#</th><th style="text-align:left">Equipo</th>
        <th>PJ</th><th>PG</th><th>PP</th><th>SF</th><th>SC</th><th>DS</th><th>PTS</th><th>⚠️</th>
      </tr></thead>
      <tbody>
        ${standings.map((t,i) => {
          const team = state.teams.find(x => x.id === t.id);
          const players = team?.players || [];
          const flags = players.reduce((acc,p) => acc + state.votes.filter(v => v.flaggedId === p.id).length, 0);
          return `<tr>
            <td style="font-weight:700;color:${i<3?'#f59e0b':'#374151'}">${medals[i] || i+1}</td>
            <td class="team-name">${t.name}</td>
            <td>${t.pj}</td>
<td>${t.pg}</td>
<td>${t.pp}</td>

<td>${t.sf}</td>
<td>${t.sc}</td>

<td style="font-weight:700">
  ${(t.sf - t.sc) > 0 ? '+' : ''}${t.sf - t.sc}
</td>

<td style="font-weight:800;color:var(--blue)">
  ${t.pts}
</td>

<td style="color:${flags>=4?'var(--red)':flags>=2?'#f59e0b':'var(--muted)'}">
  ${flags||"-"}
</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
  </div>
  <div class="legend">
    <b>Puntos:</b> Ganado = 3pts · Perdido = 0pts &nbsp;|&nbsp;
    <b>⚠️</b> = reportes de nivel (6 = revisión obligatoria)
  </div>`}`;
}

// ─── FIXTURE ─────────────────────────────────────────────────────────────────
function renderFixture() {
  const rounds = [...new Set(state.matches.map(m => m.round))].sort((a,b)=>a-b);
  const selectedRound = state.selectedRound || (rounds[0] || 1);
  const roundMatches = state.matches.filter(m => m.round === selectedRound);

  return `
  <div class="section-title">📅 Fixture</div>
  ${rounds.length === 0 ? `<div class="empty">El fixture se genera desde Admin.</div>` : ""}
  <div class="round-pills">
    ${rounds.map(r => `<button class="round-pill ${r===selectedRound?'active':''}" data-round="${r}">Fecha ${r}</button>`).join("")}
  </div>
  <div>
    ${roundMatches.map(m => {
      const res = state.results.find(r => r.matchId === m.id);
      const booking = state.bookings.find(b => b.matchId === m.id);
      const court = booking ? state.courts.find(c => c.id === booking.courtId) : null;
      return `
      <div class="match-card ${m.status === 'jugado' ? 'played' : ''}">
        <div class="match-header">
          <span style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase">Fecha ${m.round}</span>
          <span class="badge ${m.status==='jugado'?'badge-green':'badge-gray'}">${m.status}</span>
        </div>
        <div class="match-teams">
          <span class="team-label">${teamName(m.homeId)}</span>
          <span class="score-box">${res ? `${res.homeSets}-${res.awaySets}` : "VS"}</span>
          <span class="team-label">${teamName(m.awayId)}</span>
        </div>
        ${court ? `<div class="match-info">🎾 ${court.name} · ${booking.timeSlot}</div>` : ""}
        <div class="btn-row" style="margin-top:10px">
          ${state.isAdmin ? `<button class="btn btn-primary btn-sm" data-action="open-result" data-id="${m.id}">${res ? '✏️ Editar resultado' : 'Cargar resultado'}</button>` : ""}
          ${m.status === 'jugado' ? `<button class="btn btn-secondary btn-sm" data-action="open-vote" data-id="${m.id}">Votar nivel</button>` : ""}
        </div>
      </div>`;
    }).join("")}
  </div>`;
}

// ─── CANCHAS ─────────────────────────────────────────────────────────────────
function renderCanchas() {
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div class="section-title" style="margin-bottom:0">🎾 Canchas y Horarios</div>
    ${state.isAdmin ? `<button class="btn btn-primary btn-sm" data-action="open-add-court">＋ Agregar</button>` : ""}
  </div>
  ${state.courts.length === 0 ? `<div class="empty">No hay canchas cargadas.</div>` : ""}
  ${state.courts.map(court => {
    const courtBookings = state.bookings.filter(b => b.courtId === court.id);
    return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-weight:700;font-size:16px">🏟️ ${court.name}</div>
        ${state.isAdmin ? `<div style="display:flex;gap:6px"><button class="btn btn-secondary btn-sm" data-action="open-edit-court" data-id="${court.id}">✏️ Editar</button><button class="btn btn-secondary btn-sm" style="border-color:var(--red);color:var(--red)" data-action="del-court" data-id="${court.id}">Eliminar</button></div>` : ""}
      </div>
      <div class="slots">
        ${(court.slots||[]).map(slot => {
          const b = courtBookings.find(x => x.timeSlot === slot);
          const tn = b ? (state.teams.find(t => t.id === b.teamId)?.name || b.teamId) : null;
          return b
            ? `<div class="slot booked">
                <div class="slot-time">${slot}</div>
                <div class="slot-team">${tn}</div>
                <button class="slot-action" data-action="cancel-booking" data-id="${b.id}">✕ liberar</button>
               </div>`
            : `<div class="slot free">
                <div class="slot-time">${slot}</div>
                <div class="slot-team">Libre</div>
                <button class="slot-action" data-action="open-book" data-court="${court.id}" data-slot="${slot}">+ reservar</button>
               </div>`;
        }).join("")}
      </div>
    </div>`;
  }).join("")}`;
}

// ─── NIVEL ───────────────────────────────────────────────────────────────────
function renderNivel() {
  const allPlayers = state.teams.flatMap(t => (t.players||[]).map(p => ({ ...p, teamName: t.name })));
  return `
  <div class="section-title">⚠️ Control de Nivel</div>
  <div class="info-box">
    Si un jugador acumula <b>6 reportes</b> de distintos partidos, la organización debe revisar su categoría. Los reportes se hacen desde cada partido.
  </div>
  ${allPlayers.length === 0 ? `<div class="empty">No hay jugadores registrados.</div>` : ""}
  ${allPlayers.map(p => {
    const count = state.votes.filter(v => v.flaggedId === p.id).length;
    const pct = Math.min(count/6, 1) * 100;
    const color = pct >= 100 ? "var(--red)" : pct >= 50 ? "#f59e0b" : "var(--court)";
    return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div style="font-weight:700">${p.name}</div>
          <div style="font-size:12px;color:var(--muted)">${p.teamName}</div>
        </div>
        <span class="badge ${count>=6?'badge-red':count>=3?'badge-yellow':'badge-green'}">
          ${count} ${count===1?"reporte":"reportes"}
        </span>
      </div>
      <div class="vote-bar-bg">
        <div class="vote-bar" style="width:${pct}%;background:${color}"></div>
      </div>
      ${count >= 6 ? `<div style="margin-top:8px;padding:8px 10px;background:#fee2e2;border-radius:8px;font-size:12px;color:var(--red)">⚠️ Superó el límite de 6 reportes. La organización debe revisar.</div>` : ""}
    </div>`;
  }).join("")}`;
}

          <div style="font-size:11px;color:var(--muted);margin-bottom:6px">${teamName(m.awayId)}</div>
          <select id="m-as" style="width:70px;text-align:center;font-size:22px;font-family:var(--font-display);letter-spacing:1px">
            ${[0,1,2].map(n=>`<option value="${n}" ${n===(res?.awaySets??0)?'selected':''}>${n}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" data-action="do-result" data-id="${m.id}">Confirmar</button>
        ${res ? `<button class="btn btn-danger" data-action="do-del-result" data-id="${m.id}">Borrar resultado</button>` : ""}
        <button class="btn btn-secondary" data-action="close-modal">Cancelar</button>
      </div>`;
  }

  if (type === "vote") {
    const m = data.match;
    const home = state.teams.find(t => t.id === m.homeId);
    const away = state.teams.find(t => t.id === m.awayId);
    const allPlayers = [
      ...(home?.players||[]).map(p => ({ ...p, teamName: home.name })),
      ...(away?.players||[]).map(p => ({ ...p, teamName: away.name })),
    ];
    content = `
      <div class="modal-title">🗳️ Reportar Nivel</div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px">¿El nivel fue parejo? Si alguien estaba claramente fuera de categoría, marcalo.</p>
      <label class="lbl">¿Sos de qué equipo?</label>
      <select id="m-voter">
        <option value="">Seleccioná tu equipo...</option>
        <option value="${m.homeId}">${home?.name}</option>
        <option value="${m.awayId}">${away?.name}</option>
      </select>
      <label class="lbl">Nivel del partido</label>
      <div class="btn-row" style="margin-bottom:14px">
        <button class="btn btn-secondary btn-sm" id="vote-ok" data-vote="ok" style="${data.levelOk!==false?'background:var(--court);color:#fff;border-color:var(--court)':''}">✅ Fue parejo</button>
        <button class="btn btn-secondary btn-sm" id="vote-bad" data-vote="bad" style="${data.levelOk===false?'background:var(--red);color:#fff;border-color:var(--red)':''}">⚠️ Hubo diferencia</button>
      </div>
      ${data.levelOk === false ? `
        <label class="lbl">¿Quién estaba pasado de categoría?</label>
        <div style="display:flex;flex-direction:column;gap:7px;margin-bottom:14px">
          ${allPlayers.map(p => `
            <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer">
              <input type="checkbox" class="vote-check" data-pid="${p.id}" ${(data.selected||[]).includes(p.id)?'checked':''}/>
              ${p.name} <span style="font-size:12px;color:var(--muted)">(${p.teamName})</span>
            </label>`).join("")}
        </div>` : ""}
      <div class="btn-row">
        <button class="btn btn-primary" data-action="do-vote" data-matchid="${m.id}">Enviar</button>
        <button class="btn btn-secondary" data-action="close-modal">Omitir</button>
      </div>`;
  }

  return `<div class="overlay" id="overlay">
    <div class="modal">${content}</div>
  </div>`;
}

// ─── EVENTS ───────────────────────────────────────────────────────────────────
function attachEvents() {
  // Close overlay on background click
  document.getElementById("overlay")?.addEventListener("click", e => {
    if (e.target.id === "overlay") closeModal();
  });

  // Admin toggle
  document.getElementById("btn-admin-toggle")?.addEventListener("click", () => {
    if (state.isAdmin) { setState({ isAdmin: false }); return; }
    openModal("admin-login", {});
  });

  // Nav tabs
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      setState({ tab: btn.dataset.tab, selectedRound: state.selectedRound });
    });
  });

  // Round pills
  document.querySelectorAll(".round-pill").forEach(pill => {
    pill.addEventListener("click", () => setState({ selectedRound: Number(pill.dataset.round) }));
  });

  // Vote level toggle
  document.getElementById("vote-ok")?.addEventListener("click", () => {
    openModal("vote", { ...state.modal.data, levelOk: true, selected: [] });
  });
  document.getElementById("vote-bad")?.addEventListener("click", () => {
    openModal("vote", { ...state.modal.data, levelOk: false });
  });

  // Vote checkboxes
  document.querySelectorAll(".vote-check").forEach(cb => {
    cb.addEventListener("change", () => {
      const selected = [...document.querySelectorAll(".vote-check:checked")].map(x => x.dataset.pid);
      state.modal.data.selected = selected;
    });
  });

  // Data actions
  document.querySelectorAll("[data-action]").forEach(el => {
    el.addEventListener("click", async () => {
      const action = el.dataset.action;

      if (action === "close-modal") closeModal();

      if (action === "do-login") {
        const pass = document.getElementById("m-pass")?.value;
        if (pass === ADMIN_PASSWORD) { setState({ isAdmin: true, modal: null }); }
        else openModal("admin-login", { error: true });
      }

      if (action === "open-add-team") openModal("add-team", {});
      if (action === "do-add-team") {
        const n = document.getElementById("m-tname")?.value.trim();
        const p1 = document.getElementById("m-p1")?.value.trim();
        const p2 = document.getElementById("m-p2")?.value.trim();
        if (!n || !p1 || !p2) { toast("Completá todos los campos", "err"); return; }
        await addTeam(n, p1, p2);
        closeModal();
      }

      if (action === "open-edit-team") openModal("edit-team", { id: el.dataset.id });
      if (action === "do-edit-team") {
        const n = document.getElementById("m-tname")?.value.trim();
        const p1 = document.getElementById("m-p1")?.value.trim();
        const p2 = document.getElementById("m-p2")?.value.trim();
        if (!n || !p1 || !p2) { toast("Completá todos los campos", "err"); return; }
        const t = state.teams.find(x => x.id === el.dataset.id);
        const players = [
          { id: t?.players?.[0]?.id || `${el.dataset.id}-1`, name: p1 },
          { id: t?.players?.[1]?.id || `${el.dataset.id}-2`, name: p2 },
        ];
        await updateTeam(el.dataset.id, n, players);
        closeModal();
      }

      if (action === "del-team") { if (!confirm("¿Eliminar este equipo?")) return; await removeTeam(el.dataset.id); }

      if (action === "gen-fixture") {
        if (!confirm("¿Generar fixture? Se sobreescribirán los partidos existentes.")) return;
        await generateFixtureAction();
      }
      if (action === "reset-fixture") {
        if (!confirm("¿Resetear todo? Se borran fixture, resultados, votos y reservas.")) return;
        await resetFixture();
      }

      if (action === "open-add-court") openModal("add-court", {});
      if (action === "do-add-court") {
        const n = document.getElementById("m-cname")?.value.trim();
        const s = document.getElementById("m-slots")?.value.trim();
        if (!n) { toast("Poné un nombre", "err"); return; }
        await addCourt(n, s);
        closeModal();
      }
      if (action === "open-edit-court") openModal("edit-court", { id: el.dataset.id });
      if (action === "do-edit-court") {
        const n = document.getElementById("m-cname")?.value.trim();
        const s = document.getElementById("m-slots")?.value.trim();
        if (!n) { toast("Poné un nombre", "err"); return; }
        await updateCourt(el.dataset.id, n, s);
        closeModal();
      }
      if (action === "del-court") { if (!confirm("¿Eliminar esta cancha?")) return; await removeCourt(el.dataset.id); }

      if (action === "open-book") openModal("book-slot", {
        courtId: el.dataset.court,
        slot: el.dataset.slot,
        courtName: state.courts.find(c => c.id === el.dataset.court)?.name,
      });
      if (action === "do-book") {
        const teamId = document.getElementById("m-team")?.value;
        if (!teamId) { toast("Seleccioná un equipo", "err"); return; }
        await bookSlot(el.dataset.court, el.dataset.slot, teamId);
        closeModal();
      }
      if (action === "cancel-booking") await cancelBooking(el.dataset.id);

      if (action === "open-result") {
        const m = state.matches.find(x => x.id === el.dataset.id);
        openModal("result", { match: m });
      }
      if (action === "do-result") {
        const hs = Number(document.getElementById("m-hs")?.value);
        const as_ = Number(document.getElementById("m-as")?.value);
        await saveResult(el.dataset.id, hs, as_);
        const m = state.matches.find(x => x.id === el.dataset.id);
        openModal("vote", { match: m, levelOk: true, selected: [] });
      }
      if (action === "do-del-result") {
        if (!confirm("¿Borrar este resultado? El partido vuelve a estado pendiente.")) return;
        await deleteResult(el.dataset.id);
        closeModal();
      }

      if (action === "open-vote") {
        const m = state.matches.find(x => x.id === el.dataset.id);
        openModal("vote", { match: m, levelOk: true, selected: [] });
      }
      if (action === "do-vote") {
        const voterTeamId = document.getElementById("m-voter")?.value;
        if (!voterTeamId) { toast("Seleccioná tu equipo", "err"); return; }
        const selected = state.modal.data.selected || [];
        const levelOk = state.modal.data.levelOk !== false;
        await submitVotes(el.dataset.matchid, voterTeamId, selected, levelOk);
        closeModal();
      }

      if (action === "open-edit-rule") openModal("edit-rule", { id: el.dataset.id });
      if (action === "do-edit-rule") {
        const title = document.getElementById("m-rtitle")?.value.trim();
        const content = document.getElementById("m-rcontent")?.value.trim();
        if (!title) { toast("Poné un título", "err"); return; }
        await saveRule(el.dataset.id, title, content);
        closeModal();
      }
    });
  });
}

// ─── BOOTSTRAP ────────────────────────────────────────────────────────────────
firebaseOk = initFirebase();
render();
loadAll();
</script>
</body>
</html>
